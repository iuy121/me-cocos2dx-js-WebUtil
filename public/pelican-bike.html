<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕绕地球骑单车</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=bc11c703122c">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=bc11c703122c">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=bc11c703122c">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=bc11c703122c">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse at 50% 40%, #0b1026 0%, #05060f 70%, #000 100%);
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg { width: min(92vmin, 760px); height: min(92vmin, 760px); display: block; }
  .title {
    position: absolute;
    top: 18px; left: 0; right: 0;
    text-align: center;
    color: #cfe3ff;
    letter-spacing: 2px;
    font-size: 15px;
    opacity: .8;
    text-shadow: 0 0 12px #2a4d8f;
  }

  /* 闪烁星空 */
  .star { animation: tw 3s infinite ease-in-out; }
  .star:nth-child(2n) { animation-duration: 4.2s; animation-delay: .6s; }
  .star:nth-child(3n) { animation-duration: 2.4s; animation-delay: 1.2s; }
  @keyframes tw { 0%,100%{opacity:.25} 50%{opacity:1} }

  /* 地球自转：旋转大陆层 */
  .earth-spin { transform-box: fill-box; transform-origin: center; animation: spin 26s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 轨道运动：外层组绕地心公转 */
  .orbit { transform-box: fill-box; transform-origin: center; animation: orbit 9s linear infinite; }
  @keyframes orbit { to { transform: rotate(360deg); } }

  /* 反向自转：保持鹈鹕始终朝上 */
  .counter { transform-box: fill-box; transform-origin: center; animation: counter 9s linear infinite; }
  @keyframes counter { to { transform: rotate(-360deg); } }

  /* 车轮旋转 */
  .wheel-spin { transform-box: fill-box; transform-origin: center; animation: spin .5s linear infinite; }

  /* 腿部蹬车 */
  .pedal { transform-box: fill-box; transform-origin: center; animation: pedal .5s linear infinite; }
  @keyframes pedal { to { transform: rotate(360deg); } }

  /* 翅膀扇动 */
  .wing { transform-box: fill-box; transform-origin: 0% 100%; animation: flap 1.1s ease-in-out infinite; }
  @keyframes flap { 0%,100%{transform: rotate(-6deg)} 50%{transform: rotate(16deg)} }

  /* 嘴里叼的鱼：轻微摆动 */
  .fish { transform-box: fill-box; transform-origin: left center; animation: fishw .9s ease-in-out infinite; }
  @keyframes fishw { 0%,100%{transform: rotate(-4deg)} 50%{transform: rotate(6deg)} }

  @media (prefers-reduced-motion: reduce) {
    .earth-spin,.orbit,.counter,.wheel-spin,.pedal,.wing,.fish,.star { animation: none !important; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="title">🚴 鹈鹕号 · 环球骑行中</div>

  <svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-label="一只鹈鹕骑着自行车绕着地球转动">

    <!-- 渐变定义 -->
    <defs>
      <radialGradient id="ocean" cx="38%" cy="32%" r="75%">
        <stop offset="0%" stop-color="#5ec3ff"/>
        <stop offset="55%" stop-color="#1f7fd0"/>
        <stop offset="100%" stop-color="#0a3f7a"/>
      </radialGradient>
      <radialGradient id="atmos" cx="50%" cy="50%" r="55%">
        <stop offset="78%" stop-color="#9fd4ff" stop-opacity="0"/>
        <stop offset="96%" stop-color="#9fd4ff" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#9fd4ff" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fffdf5"/>
        <stop offset="100%" stop-color="#e9d6a6"/>
      </linearGradient>
      <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#ffb24a"/>
        <stop offset="100%" stop-color="#e07b00"/>
      </linearGradient>
      <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffd07a"/>
        <stop offset="100%" stop-color="#f59a2c"/>
      </linearGradient>
      <linearGradient id="frameG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ff5b6e"/>
        <stop offset="100%" stop-color="#b21126"/>
      </linearGradient>
    </defs>

    <!-- 星空 -->
    <g fill="#cfe3ff">
      <circle class="star" cx="40"  cy="60"  r="1.4"/>
      <circle class="star" cx="120" cy="30"  r="1"/>
      <circle class="star" cx="210" cy="80"  r="1.6"/>
      <circle class="star" cx="310" cy="40"  r="1"/>
      <circle class="star" cx="430" cy="70"  r="1.3"/>
      <circle class="star" cx="520" cy="35"  r="1"/>
      <circle class="star" cx="560" cy="130" r="1.5"/>
      <circle class="star" cx="30"  cy="250" r="1"/>
      <circle class="star" cx="570" cy="300" r="1.4"/>
      <circle class="star" cx="20"  cy="430" r="1.2"/>
      <circle class="star" cx="90"  cy="560" r="1"/>
      <circle class="star" cx="250" cy="570" r="1.5"/>
      <circle class="star" cx="400" cy="560" r="1"/>
      <circle class="star" cx="540" cy="500" r="1.3"/>
      <circle class="star" cx="480" cy="560" r="1"/>
    </g>

    <!-- 地球 (中心 300,300) -->
    <g>
      <!-- 大气光晕 -->
      <circle cx="300" cy="300" r="150" fill="url(#atmos)"/>
      <!-- 海洋 -->
      <circle cx="300" cy="300" r="128" fill="url(#ocean)"/>

      <!-- 自转的大陆层（在圆内用 clip 裁切） -->
      <g clip-path="circle(128px at 300px 300px)">
        <g class="earth-spin" style="transform-origin:300px 300px">
          <!-- 简化大陆块 -->
          <path d="M250 210 q30 -30 70 -18 q35 10 10 40 q-20 25 -55 15 q-40 -10 -25 -37z"
                fill="#4fa05a" opacity=".95"/>
          <path d="M330 250 q40 -8 60 18 q15 28 -10 40 q-30 12 -48 -8 q-22 -22 -2 -50z"
                fill="#5cb267" opacity=".95"/>
          <path d="M270 300 q28 -6 44 16 q12 26 -10 38 q-28 12 -44 -10 q-14 -24 10 -44z"
                fill="#4f9b58" opacity=".95"/>
          <path d="M360 320 q35 -4 40 22 q2 24 -26 28 q-30 4 -34 -20 q-2 -22 20 -30z"
                fill="#5cb267" opacity=".9"/>
          <path d="M250 360 q30 4 40 26 q4 26 -24 26 q-34 2 -36 -22 q0 -24 20 -30z"
                fill="#4fa05a" opacity=".9"/>
          <path d="M320 370 q24 -2 30 18 q2 20 -22 22 q-26 2 -28 -16 q0 -18 20 -24z"
                fill="#5cb267" opacity=".85"/>
        </g>
      </g>

      <!-- 经纬线 + 高光 -->
      <circle cx="300" cy="300" r="128" fill="none" stroke="#9fd4ff" stroke-opacity=".18" stroke-width="1"/>
      <ellipse cx="270" cy="250" rx="40" ry="22" fill="#ffffff" opacity=".10"/>
      <!-- 轨道虚线 -->
      <circle cx="300" cy="300" r="210" fill="none" stroke="#6f8fc7"
              stroke-width="1.2" stroke-dasharray="3 8" opacity=".5"/>
    </g>

    <!-- 鹈鹕骑手：放在轨道右侧 (510,300)，组中心对齐地心方向 -->
    <!-- 外层公转组：把骑手从地心(300,300)平移到轨道半径210处 -->
    <g class="orbit" style="transform-origin:300px 300px">
      <!-- 内层：再次平移到 (510,300) 作为骑手中心 -->
      <g transform="translate(510,300)">
        <!-- 反向自转：保持鹈鹕相对屏幕直立 -->
        <g class="counter" style="transform-origin:0 0">

          <!-- 骑手整体（围绕 0,0 是车架中部；车在下方，鹈鹕在上方） -->
          <!-- 单车 + 鹈鹕 统一绘制，面向右侧(前进方向) -->

          <!-- 后轮 (中心 -42,28) -->
          <g transform="translate(-42,28)">
            <circle r="26" fill="none" stroke="#2b2b2b" stroke-width="3.5"/>
            <circle r="5" fill="#3a3a3a"/>
            <g class="wheel-spin" style="transform-origin:0 0">
              <g stroke="#5a5a5a" stroke-width="2.2">
                <line x1="-24" y1="0" x2="24" y2="0"/>
                <line x1="0" y1="-24" x2="0" y2="24"/>
                <line x1="-17" y1="-17" x2="17" y2="17"/>
                <line x1="-17" y1="17" x2="17" y2="-17"/>
              </g>
            </g>
          </g>

          <!-- 前轮 (中心 42,28) -->
          <g transform="translate(42,28)">
            <circle r="26" fill="none" stroke="#2b2b2b" stroke-width="3.5"/>
            <circle r="5" fill="#3a3a3a"/>
            <g class="wheel-spin" style="transform-origin:0 0">
              <g stroke="#5a5a5a" stroke-width="2.2">
                <line x1="-24" y1="0" x2="24" y2="0"/>
                <line x1="0" y1="-24" x2="0" y2="24"/>
                <line x1="-17" y1="-17" x2="17" y2="17"/>
                <line x1="-17" y1="17" x2="17" y2="-17"/>
              </g>
            </g>
          </g>

          <!-- 车架 (红色) -->
          <g stroke="url(#frameG)" stroke-width="5" stroke-linecap="round" fill="none">
            <line x1="-42" y1="28" x2="-6" y2="-18"/>   <!-- 后下叉 -->
            <line x1="-6" y1="-18" x2="0" y2="-46"/>    <!-- 座管 -->
            <line x1="-42" y1="28" x2="0" y2="-46"/>    <!-- 后上叉 -->
            <line x1="0" y1="-46" x2="30" y2="-40"/>    <!-- 上管 -->
            <line x1="30" y1="-40" x2="42" y2="28"/>    <!-- 前管到前轮 -->
            <line x1="-6" y1="-18" x2="30" y2="-40"/>   <!-- 下管 -->
            <line x1="30" y1="-40" x2="40" y2="-58"/>   <!-- 车把立管 -->
          </g>
          <!-- 车把 -->
          <path d="M30 -58 q-10 -4 -14 4 M30 -58 q10 -4 16 6"
                fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
          <!-- 座垫 -->
          <path d="M-12 -48 q14 -6 26 0 q-14 4 -26 0z" fill="#2b2b2b"/>

          <!-- 踏板曲柄（绕中轴 -6,-18 旋转） -->
          <g class="pedal" style="transform-origin:-6px -18px">
            <line x1="-6" y1="-18" x2="10" y2="-6" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="-6" y1="-18" x2="-22" y2="-30" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
            <rect x="6" y="-10" width="9" height="4" rx="1.5" fill="#111"/>
            <rect x="-27" y="-34" width="9" height="4" rx="1.5" fill="#111"/>
          </g>

          <!-- 鹈鹕骑手：坐在座垫上方 -->
          <g transform="translate(2,-52)">
            <!-- 尾羽 -->
            <path d="M-30 -2 q-16 -2 -22 -10 q12 2 22 6z" fill="#c9a23a"/>
            <!-- 身体 -->
            <path d="M-28 -2 q-6 -26 22 -28 q34 -2 38 16 q4 18 -16 24 q-24 8 -44 -12z"
                  fill="url(#bodyG)" stroke="#caa64c" stroke-width="1.2"/>
            <!-- 翅膀 (扇动) -->
            <g class="wing">
              <path d="M-6 -16 q20 -8 38 -4 q-12 16 -34 16 q-6 0 -4 -12z"
                    fill="#e9d6a6" stroke="#b8923a" stroke-width="1"/>
              <path d="M2 -14 l4 -8 M12 -13 l5 -9 M22 -12 l4 -9"
                    stroke="#b8923a" stroke-width="1.2" fill="none"/>
            </g>

            <!-- 脖子 -->
            <path d="M24 -22 q22 -22 44 -18 q8 2 6 12 q-4 10 -20 8 q-16 0 -30 -2z"
                  fill="url(#bodyG)" stroke="#caa64c" stroke-width="1"/>
            <!-- 头 -->
            <circle cx="64" cy="-30" r="15" fill="url(#bodyG)" stroke="#caa64c" stroke-width="1.2"/>
            <!-- 眼 -->
            <circle cx="69" cy="-33" r="4.5" fill="#fff"/>
            <circle cx="70.5" cy="-32.5" r="2.6" fill="#222"/>
            <circle cx="71.4" cy="-33.2" r="0.9" fill="#fff"/>
            <!-- 眉毛 -->
            <path d="M65 -40 q6 -4 12 -1" fill="none" stroke="#b07a1a" stroke-width="1.6" stroke-linecap="round"/>

            <!-- 上喙 -->
            <path d="M76 -33 q26 -2 40 6 q-4 6 -20 6 q-14 0 -20 -4z"
                  fill="url(#beakG)" stroke="#b85d00" stroke-width="1"/>
            <!-- 喉囊(下喙) -->
            <path d="M76 -25 q20 18 36 6 q-2 8 -16 12 q-16 4 -22 -10z"
                  fill="url(#pouchG)" stroke="#d4881c" stroke-width="1" opacity=".95"/>
            <!-- 喉囊纹 -->
            <path d="M82 -16 q14 6 26 0 M84 -11 q12 5 22 -1"
                  fill="none" stroke="#d4881c" stroke-width="0.8" opacity=".7"/>

            <!-- 嘴里叼的鱼 -->
            <g class="fish" transform="translate(116,-26)">
              <path d="M0 0 q12 -6 22 0 q-6 6 -22 4z" fill="#7fb6e6" stroke="#3a6a92" stroke-width="1"/>
              <path d="M22 0 l8 -5 v10z" fill="#5a9bd2"/>
              <circle cx="6" cy="-1" r="1.4" fill="#1c2c3a"/>
            </g>

            <!-- 腿(蹬车) 连到踏板 -->
            <path d="M-8 14 q4 12 20 14" fill="none" stroke="#caa64c" stroke-width="4" stroke-linecap="round"/>
            <path d="M6 12 q10 10 28 8" fill="none" stroke="#caa64c" stroke-width="4" stroke-linecap="round"/>
            <!-- 脚(蹼) -->
            <path d="M18 30 q8 4 14 -2 q-2 -4 -14 -2z" fill="#e07b00"/>
            <path d="M34 22 q8 4 14 -2 q-2 -4 -14 -2z" fill="#e07b00"/>
          </g>

          <!-- 运动尾迹 -->
          <path d="M-90 0 q40 -4 70 0" fill="none" stroke="#9fd4ff"
                stroke-width="2" stroke-dasharray="2 10" opacity=".5" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </svg>
</div>
</body>
</html>
